{% extends 'base.html' %}
{% block title %}403 Forbidden Access{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center; padding: 40px 20px;">
  <h2 style="font-size: 3rem; color: var(--status-rejected); margin-bottom: 8px;">403</h2>
  <h3 style="color: var(--brand-primary); margin-bottom: 16px;">Access Forbidden</h3>
  <p style="color: var(--text-muted); margin-bottom: 24px;">
    You do not possess the required administrative or role permissions to access this facility or administrative record.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
