{% extends 'base.html' %}
{% block title %}500 Internal Error{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center; padding: 40px 20px;">
  <h2 style="font-size: 3rem; color: var(--status-rejected); margin-bottom: 8px;">500</h2>
  <h3 style="color: var(--brand-primary); margin-bottom: 16px;">System Execution Error</h3>
  <p style="color: var(--text-muted); margin-bottom: 24px;">
    An unexpected error occurred during database processing. The current transaction was safely rolled back to preserve data integrity.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
