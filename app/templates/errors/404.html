{% extends 'base.html' %}
{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center; padding: 40px 20px;">
  <h2 style="font-size: 3rem; color: var(--brand-primary); margin-bottom: 8px;">404</h2>
  <h3 style="color: var(--brand-primary); margin-bottom: 16px;">Resource Not Found</h3>
  <p style="color: var(--text-muted); margin-bottom: 24px;">
    The requested seminar booking, hall record, or page URL could not be found in the system.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
